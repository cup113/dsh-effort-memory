name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package declares engines.node >= 20.19.0.
        node: ['20.x', '22.x']
    steps:
      # v5 of both actions runs on Node 24; v4 is deprecated on GitHub runners.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install: the plugin is deliberately dependency-free,
      # so `npm test` only needs Node itself.
      - name: Run the test suites
        run: npm test
